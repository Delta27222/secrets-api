name: Promote development → staging

# Al hacer push a development, fusiona development en staging y lo empuja.
# El push a staging dispara el workflow deploy-staging.yml.
on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge development → staging
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --exit-code --heads origin staging >/dev/null 2>&1; then
            git checkout -B staging origin/staging
            git merge --no-edit origin/development
          else
            # staging no existe todavía → créalo a partir de development
            git checkout -B staging origin/development
          fi
          git push origin staging
